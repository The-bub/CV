<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // The intro loader locks the page at 100vh while it plays, so Lenis and
        // ScrollTrigger would both measure a clamped document if the browser
        // restored a previous scroll offset — leaving the scroll dead and every
        // section stuck at opacity 0 after a reload further down the page.
        // Own the entry point instead; App restores any #hash once handed over.
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        // The palette switcher and motion toggle are gone, so nothing reads the
        // old `cv-palette` / `cv-motion` keys any more: a returning visitor who
        // had stored a choice would otherwise be stuck with it for good. Sapin
        // and full motion are now simply the site.
        document.documentElement.setAttribute("data-motion", "full");
      })();
    </script>
